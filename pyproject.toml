[project]
name = "rabbitbus"
version = "0.1.0"
description = "RabbitMQ service bus for Python, compatible with go-rabbitbus"
authors = [
    {name = "logiqbits"}
]
requires-python = ">=3.8"
dependencies = [
    "pika (>=1.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
